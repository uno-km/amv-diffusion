code_example_py: "import termux_diffusion as td\n\n# Generate image using official on-device acceleration\nimage_path = td.generate(\n\
  \    prompt=\"A cinematic photo of a neon cybernetic tiger walking in Seoul street at night\",\n    model=\"anime\",\n \
  \   steps=6,\n    device=\"vulkan\"\n)\nprint(f\"Generated and saved to Gallery: {image_path}\")\n"
code_example_js: "import { generate } from \"termux-diffusion\";\n\nconst result = await generate({\n  prompt: \"A cinematic\
  \ photo of a neon cybernetic tiger walking in Seoul street at night\",\n  model: \"anime\",\n  steps: 6,\n  device: \"vulkan\"\
  \n});\nconsole.log(\"Image created:\", result.outputPath);\n"
benchmarks_body: "<div class=\"alert alert-tip\">\n  <span class=\"alert-title\">\U0001F4F1 Official Samsung Galaxy S21 5G\
  \ Hardware Case Study</span>\n  <p>Physical mobile verification was completed on Samsung Galaxy S21 5G (Samsung Exynos 2100\
  \ / ARM Mali-G78 MP14) on native Android 14 Termux Bionic libc. Total GPU allocation was strictly capped at 1.0 GB VRAM\
  \ via dynamic layer streaming, achieving 100% convergence with zero memory crashes (OOM Zero).</p>\n</div>\n\n<h3>1. Galaxy\
  \ S21 5G Verification Parameters</h3>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Verification Case</th>\n\
  \      <th>Architecture & Model</th>\n      <th>Prompt</th>\n      <th>Parameters & Hardware Flags</th>\n      <th>Output\
  \ Artifact</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Z-Image Turbo (8-Step DiT)</strong></td>\n\
  \      <td>6.0B Diffusion Transformer + Qwen3-4B LLM + TAESD FLUX.1</td>\n      <td><code>\"A cinematic photo of a neon\
  \ cybernetic tiger walking in Seoul street at night\"</code></td>\n      <td><code>-W 512 -H 512 -t 4 --steps 8 --cfg-scale\
  \ 1.0 --sampling-method euler --backend clip=cpu,diffusion=vulkan0,vae=cpu --max-vram vulkan0=1 --stream-layers --params-backend\
  \ diffusion=cpu --diffusion-fa --mmap --vae-tiling --vae-format flux</code></td>\n      <td><code>s21_z_image_turbo_8step.png</code></td>\n\
  \    </tr>\n    <tr>\n      <td><strong>DreamShaper 8 (6-Step LCM)</strong></td>\n      <td>UNet LCM Fast Inference (GGUF\
  \ Q4_0)</td>\n      <td><code>\"A cinematic photo of a neon cybernetic tiger walking in Seoul street at night\"</code></td>\n\
  \      <td><code>-W 512 -H 512 -t 4 --steps 6 --cfg-scale 1.5 --sampler lcm --seed 42 --backend clip=vulkan0,diffusion=vulkan0,vae=cpu\
  \ --vae-on-cpu --vae-tiling --diffusion-fa --mmap</code></td>\n      <td><code>s21_anime_tiger_6step.png</code></td>\n \
  \   </tr>\n  </tbody>\n</table>\n\n<h3>2. Architectural Memory & Stability Profiling</h3>\n<table class=\"data-table\">\n\
  \  <thead>\n    <tr>\n      <th>Model Architecture</th>\n      <th>Parameter Scale</th>\n      <th>VRAM Footprint</th>\n\
  \      <th>System RAM Stability</th>\n      <th>Convergence Rate</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n    \
  \  <td><strong>Z-Image Turbo</strong></td>\n      <td>6.0 Billion (DiT)</td>\n      <td>1.0 GB Fixed (Layer Streaming)</td>\n\
  \      <td>Stable LPDDR5 Buffer (~2.4 GB)</td>\n      <td>100% (Zero-OOM, Specular PBR Fidelity)</td>\n    </tr>\n    <tr>\n\
  \      <td><strong>DreamShaper 8 (LCM)</strong></td>\n      <td>1.0 Billion (UNet)</td>\n      <td>1.55 GB Total Params\
  \ (Vulkan FP16)</td>\n      <td>Stable LPDDR5 Buffer (~1.9 GB)</td>\n      <td>100% (Zero-OOM, Full MediaStore Sync)</td>\n\
  \    </tr>\n  </tbody>\n</table>\n\n<div class=\"alert alert-note\">\n  <span class=\"alert-title\">\U0001F52C Academic\
  \ Whitepaper & Research Lab Reference</span>\n  <p>For complete theoretical formulations, shader dispatch analysis, and\
  \ micro-kernel memory traces, visit the <a href=\"https://uno-km.vercel.app/labs/\" target=\"_blank\"><strong>AMEVA Edge\
  \ Systems Lab (AESL) Research Portal</strong></a> and view the official <a href=\"https://github.com/uno-km/termux-diffusion/blob/main/docs/research/s21_z_image_turbo_vulkan_research_report.md\"\
  \ target=\"_blank\"><strong>Galaxy S21 Z-Image Turbo Vulkan Research Report</strong></a>.</p>\n</div>\n"
advanced_parameters_body: "<div class=\"alert alert-tip\">\n  <span class=\"alert-title\">\U0001F680 Advanced Parameter Control\
  \ & Hybrid Scheduling</span>\n  <p>Termux-Diffusion exposes granular hardware control across CPU worker threads, Khronos\
  \ Vulkan compute shaders, and memory-mapped buffers.</p>\n</div>\n\n<h3>1. Production Parameter Taxonomy</h3>\n<table class=\"\
  data-table\">\n  <thead>\n    <tr>\n      <th>Flag</th>\n      <th>Type</th>\n      <th>Default</th>\n      <th>Engineering\
  \ Function</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>--diffusion-model &lt;path&gt;</code></td>\n\
  \      <td>Path</td>\n      <td>Built-in</td>\n      <td>Explicit path to 6.0B DiT or UNet weights (GGUF format)</td>\n\
  \    </tr>\n    <tr>\n      <td><code>--llm &lt;path&gt;</code></td>\n      <td>Path</td>\n      <td>Built-in</td>\n   \
  \   <td>Path to large language model text encoder (e.g. Qwen3-4B-Instruct)</td>\n    </tr>\n    <tr>\n      <td><code>--taesd\
  \ &lt;path&gt;</code></td>\n      <td>Path</td>\n      <td>Built-in</td>\n      <td>Path to ultra-lightweight Tiny AutoEncoder\
  \ (taef1.safetensors) for ultra-fast VAE decode</td>\n    </tr>\n    <tr>\n      <td><code>--stream-layers</code></td>\n      <td>Boolean</td>\n\
  \      <td>Off</td>\n      <td>Dynamically streams DiT layers across AXI bus to observe strict 1GB VRAM caps</td>\n    </tr>\n\
  \    <tr>\n      <td><code>--max-vram &lt;target=size&gt;</code></td>\n      <td>String</td>\n      <td>None</td>\n    \
  \  <td>Hard allocation ceiling on GPU heap (e.g. <code>vulkan0=1</code>) to prevent Android LMK kills</td>\n    </tr>\n\
  \    <tr>\n      <td><code>--params-backend &lt;module=target&gt;</code></td>\n      <td>String</td>\n      <td>Auto</td>\n\
  \      <td>Binds model parameter storage (e.g. <code>diffusion=cpu</code>) for LPDDR5 residency</td>\n    </tr>\n    <tr>\n\
  \      <td><code>--backend &lt;spec&gt;</code></td>\n      <td>String</td>\n      <td>Auto</td>\n      <td>Asymmetric engine\
  \ assignment (e.g. <code>clip=cpu,diffusion=vulkan0,vae=cpu</code>)</td>\n    </tr>\n    <tr>\n      <td><code>--diffusion-fa</code></td>\n\
  \      <td>Boolean</td>\n      <td>Off</td>\n      <td>Tiled Flash Attention kernel reducing attention memory complexity\
  \ from O(N²) to O(N)</td>\n    </tr>\n    <tr>\n      <td><code>--vae-on-cpu</code></td>\n      <td>Boolean</td>\n     \
  \ <td>Off</td>\n      <td>Offloads VAE decoding to CPU cores, freeing GPU VRAM during final image restoration</td>\n   \
  \ </tr>\n    <tr>\n      <td><code>--vae-tiling</code></td>\n      <td>Boolean</td>\n      <td>Off</td>\n      <td>Tiled\
  \ spatial latent reconstruction preventing 1.2GB decoding memory spikes</td>\n    </tr>\n  </tbody>\n</table>\n\n<h3>2.\
  \ Documentation Overhaul Roadmap (차기 파라미터 전수 개편 계획)</h3>\n<div class=\"features-grid\">\n  <div class=\"feature-card\">\n\
  \    <h4>Phase 1: Dynamic VRAM-Budget Autotuning Matrix (v1.8.1)</h4>\n    <p>Interactive parameter calculator querying\
  \ device SoC and physical RAM to automatically synthesize optimal CLI flags.</p>\n  </div>\n  <div class=\"feature-card\"\
  >\n    <h4>Phase 2: Mobile GPU Architecture Presets (v1.8.2)</h4>\n    <p>Targeted configurations tuned for ARM Mali (G68/G78),\
  \ Qualcomm Adreno (650/730/830), and Samsung Xclipse (RDNA).</p>\n  </div>\n  <div class=\"feature-card\">\n    <h4>Phase\
  \ 3: Multi-Model Schema Unification (v1.9.0)</h4>\n    <p>Unified JSON schema validation across Python SDK, Node.js SDK,\
  \ and REST test harnesses with fail-fast assertions.</p>\n  </div>\n</div>\n"
changelog:
- version: v1.8.0
  date: '2026-09-28'
  title: Official Z-Image Turbo 6.0B DiT Support & Sovereign Acceleration Release
  type: Production Release (Latest)
  changes:
  - Official production support for Z-Image Turbo 6.0B Diffusion Transformer on Android Termux.
  - Tri-Engine asymmetric offloading pipeline (Qwen3-4B LLM on CPU + DiT on Vulkan GPU + TAESD VAE).
  - Dynamic layer streaming (--stream-layers) guaranteeing Zero-OOM execution within 1.0 GB VRAM.
  - Physical validation on Samsung Galaxy S21 5G (Exynos 2100 / Mali-G78 MP14) with 100% convergence.
  - Full integration with AMEVA Edge Systems Lab (AESL) research whitepaper and documentation portal.
  - Established complete roadmap for comprehensive parameter manual overhaul.
readme_content: "# Termux-Diffusion\n\n[![PyPI](https://img.shields.io/pypi/v/termux-diffusion.svg?style=flat-square&color=0369a1)](https://pypi.org/project/termux-diffusion/)\n\
  [![Python](https://img.shields.io/pypi/pyversions/termux-diffusion.svg?style=flat-square)](https://pypi.org/project/termux-diffusion/)\n\
  [![npm](https://img.shields.io/npm/v/termux-diffusion.svg?style=flat-square&color=b91c1c)](https://www.npmjs.com/package/termux-diffusion)\n\
  [![npm downloads](https://img.shields.io/npm/dm/termux-diffusion.svg?style=flat-square&color=b91c1c)](https://www.npmjs.com/package/termux-diffusion)\n\
  [![License](https://img.shields.io/badge/License-Apache_2.0-004499.svg?style=flat-square)](https://github.com/uno-km/termux-diffusion)\n\
  \n> **Official Support for Z-Image Turbo (6.0B DiT) & Pure Native On-Device Diffusion Acceleration for Android Termux &\
  \ Samsung Galaxy.**  \n> *Zero PRoot. Zero Virtualization. 100% Native ARM64 Bionic libc, Khronos Vulkan 1.1+ GPU Shaders\
  \ & NEON SIMD Vector Engine.*\n\n---\n\n## \U0001F680 Major Breakthrough: 6.0B DiT (Z-Image Turbo) Sovereign Mobile Execution\n\
  \n`termux-diffusion v1.8.0` officially achieves a world-class on-device AI milestone: **Native, unquantized context execution\
  \ of 6.0 Billion Parameter Diffusion Transformers (DiT)** on commercial Android hardware (Samsung Galaxy S21 5G / ARM Mali-G78\
  \ MP14 GPU) without cloud dependencies.\n\n### \U0001F31F Tri-Engine Asymmetric Pipeline Architecture\n```\n[User Natural\
  \ Language Prompt]\n          │\n          ▼\n┌────────────────────────────────────────────────────────┐\n│ 1. Text Encoder\
  \ (Qwen3-4B-Instruct-2507-Q2_K.gguf)     │ ◄── CPU 4-Core Parallel SIMD (clip=cpu)\n│    - 4.0B LLM Context Understanding\
  \ & Dense Embedding  │\n└────────────────────────────────────────────────────────┘\n          │ (High-Dimensional Prompt\
  \ Embeddings)\n          ▼\n┌────────────────────────────────────────────────────────┐\n│ 2. DiT Denoising Core (z_image_turbo-Q2_K.gguf)\
  \        │ ◄── Mali-G78 Vulkan Shaders (diffusion=vulkan0)\n│    - 6.0B Diffusion Transformer                        │ \
  \    Dynamic Layer Streaming (stream-layers)\n│    - Tiled Flash Attention (--diffusion-fa)            │     Strict 1.0\
  \ GB VRAM Ceiling (max-vram=1GB)\n└────────────────────────────────────────────────────────┘\n          │ (Latent Representation)\n\
  \          ▼\n┌────────────────────────────────────────────────────────┐\n│ 3. Ultra-Fast VAE Decoder (taef1.safetensors)\
  \          │ ◄── 10MB Tiny AutoEncoder (taesd, vae=cpu)\n│    - Fast Latent Decoding with Zero VRAM Spike   │\n└────────────────────────────────────────────────────────┘\n\
  \          │\n          ▼\n[24-bit RGB PNG Image Artifact] (512 x 512)\n```\n\n---\n\n## \U0001F4F8 Sovereign Physical Verification:\
  \ Galaxy S21 DiT 8-Step Output\n\n![Galaxy S21 Z-Image Turbo 8-Step Verification Output](docs/research/s21_z_image_turbo_8step.png)\n\
  \n### 1. Verification Prompt (Ground Truth)\n```text\n\"A cinematic photo of a neon cybernetic tiger walking in Seoul street\
  \ at night\"\n```\n\n### 2. Verified Input Parameter Engineering\n| Parameter Flag | Applied Setting | Engineering Purpose\
  \ & Mechanism |\n| :--- | :--- | :--- |\n| **`--diffusion-model`** | `z_image_turbo-Q2_K.gguf` | 6.0B Diffusion Transformer\
  \ backbone network |\n| **`--llm`** | `Qwen3-4B-Instruct-2507-Q2_K.gguf` | 4.0B Parameter LLM text encoder for dense prompt\
  \ comprehension |\n| **`--taesd`** | `taef1.safetensors` | 10 MB Tiny AutoEncoder for instant FLUX.1 latent-to-pixel decoding\
  \ |\n| **`--steps`** | `8` | Optimal numerical convergence for distilled DiT architectures |\n| **`--cfg-scale`** | `1.0`\
  \ | Prevents over-saturation artifacts on distilled flow models |\n| **`--sampling-method`** | `euler` | 1st-order Ordinary\
  \ Differential Equation (ODE) numerical solver |\n| **`--backend`** | `clip=cpu,diffusion=vulkan0,vae=cpu` | Allocates GPU\
  \ VRAM strictly to DiT while offloading LLM/VAE to CPU |\n| **`--stream-layers`** | Enabled | Streams DiT layers over AXI\
  \ bus into VRAM sequentially |\n| **`--max-vram`** | `vulkan0=1` (1.0 GB) | Guarantees Zero-LMK memory safety within Android\
  \ OS limits |\n| **`--diffusion-fa`** | Enabled | Tiled Flash Attention reduces attention memory complexity to $O(N)$ |\n\
  | **`--params-backend`** | `diffusion=cpu` | Keeps weights in 8GB LPDDR5 system RAM to avoid VRAM exhaustion |\n| **`--vae-tiling`**\
  \ | Enabled | Prevents memory allocation spikes during final latent reconstruction |\n\n### 3. Rendering Quality & Optical\
  \ Ground Truth\n* **Specular PBR Reflection**: Realistic light scattering from neon signboards on wet Seoul asphalt road\
  \ surfaces.\n* **Geometric Armor Definition**: Razor-sharp boundary definition on the cybernetic tiger's composite metal\
  \ armor plates.\n* **Micro-Texture Integrity**: Individual whiskers and fur textures cleanly separated from background high-frequency\
  \ noise.\n* **Zero-Crash Stability**: 100% completion achieved with zero Out-of-Memory (LMK) aborts and zero thermal throttling\
  \ termination.\n\n### \U0001F52C Academic Research & Lab Milestone Report\n* **Full Technical Research Report**: [Galaxy\
  \ S21 Z-Image Turbo Vulkan Research Report](docs/research/s21_z_image_turbo_vulkan_research_report.md)\n* **AMEVA Edge Systems\
  \ Lab (AESL)**: [https://uno-km.vercel.app/labs/](https://uno-km.vercel.app/labs/)\n\n---\n\n## \U0001F4BB 3-Channel Practical\
  \ User Manual: CLI, PIP, NPM\n\n`termux-diffusion` delivers 100% feature parity across **Terminal CLI**, **Python SDK (PyPI)**,\
  \ and **Node.js SDK (NPM)**.\n\n### 1. Installation\n\n* **Python SDK (PyPI)**:\n  ```bash\n  pip install termux-diffusion\n\
  \  termux-diffusion install\n  ```\n\n* **Node.js / TypeScript SDK & CLI (NPM)**:\n  ```bash\n  npm install -g termux-diffusion\n\
  \  npx termux-diffusion install\n  ```\n\n---\n\n### 2. Terminal CLI Manual\n\n#### [Method 1] One-Touch High-Level Command\n\
  ```bash\ntermux-diffusion generate \"A cinematic photo of a neon cybernetic tiger walking in Seoul street at night\" \\\n\
  \  --preset z-image-turbo \\\n  --device vulkan \\\n  --steps 8 \\\n  --cfg 1.0 \\\n  --sampler euler \\\n  --diffusion-fa\
  \ \\\n  --stream-layers \\\n  --max-vram vulkan0=1 \\\n  --clip-on-cpu \\\n  --vae-on-cpu \\\n  --taesd auto \\\n  -o /sdcard/Pictures/TermuxDiffusion/cyber_tiger_dit.png\n\
  ```\n\n#### [Method 2] Low-Level Native Binary Direct Execution\n```bash\nsd-cli-vulkan \\\n  -p \"A cinematic photo of\
  \ a neon cybernetic tiger walking in Seoul street at night\" \\\n  -W 512 -H 512 -t 4 \\\n  --steps 8 --cfg-scale 1.0 --sampling-method\
  \ euler \\\n  --diffusion-model ~/.cache/termux-diffusion/models/z_image_turbo-Q2_K.gguf \\\n  --llm ~/.cache/termux-diffusion/models/Qwen3-4B-Instruct-2507-Q2_K.gguf\
  \ \\\n  --taesd ~/.cache/termux-diffusion/models/taef1.safetensors \\\n  --clip-on-cpu --vae-on-cpu --vae-format flux --mmap\
  \ --diffusion-fa \\\n  --backend clip=cpu,diffusion=vulkan0,vae=cpu \\\n  --max-vram vulkan0=1 --stream-layers --params-backend\
  \ diffusion=cpu --vae-tiling \\\n  -o /sdcard/Pictures/TermuxDiffusion/cyber_tiger_dit.png\n```\n\n---\n\n### 3. Python\
  \ SDK Manual (pip install termux-diffusion)\n\n```python\nimport termux_diffusion as td\n\n# Official Z-Image Turbo 6.0B\
  \ DiT Synthesis via Python API\nimage_path = td.generate(\n    prompt=\"A cinematic photo of a neon cybernetic tiger walking\
  \ in Seoul street at night\",\n    preset=\"z-image-turbo\",\n    steps=8,\n    cfg_scale=1.0,\n    sampler=\"euler\",\n\
  \    device=\"vulkan\",\n    diffusion_fa=True,\n    stream_layers=True,\n    max_vram=\"vulkan0=1\",\n    clip_on_cpu=True,\n\
  \    vae_on_cpu=True,\n    taesd=\"auto\",\n    output_path=\"/sdcard/Pictures/TermuxDiffusion/cyber_tiger_dit.png\"\n)\n\
  \nprint(f\"Generated and synchronized to Samsung Gallery: {image_path}\")\n```\n\n---\n\n### 4. Node.js / TypeScript SDK\
  \ Manual (npm install termux-diffusion)\n\n```typescript\nimport { generate } from \"termux-diffusion\";\n\nasync function\
  \ main(): Promise<void> {\n  // Official Z-Image Turbo 6.0B DiT Synthesis via Node.js API\n  const result = await generate({\n\
  \    prompt: \"A cinematic photo of a neon cybernetic tiger walking in Seoul street at night\",\n    preset: \"z-image-turbo\"\
  ,\n    steps: 8,\n    cfgScale: 1.0,\n    sampler: \"euler\",\n    device: \"vulkan\",\n    diffusionFa: true,\n    streamLayers:\
  \ true,\n    maxVram: \"vulkan0=1\",\n    clipOnCpu: true,\n    vaeOnCpu: true,\n    taesd: \"auto\",\n    outputPath: \"\
  /sdcard/Pictures/TermuxDiffusion/cyber_tiger_dit.png\"\n  });\n\n  console.log(\"DiT Synthesis Complete. Artifact:\", result.outputPath);\n\
  }\n\nmain().catch(console.error);\n```\n\n---\n\n## \U0001F39B️ Complete Parameter Reference Matrix\n\n| Parameter Flag\
  \ | Python SDK Key | Node.js Key | Type | Default | Engineering Purpose |\n| :--- | :--- | :--- | :---: | :---: | :--- |\n\
  | `-p, --prompt` | `prompt` | `prompt` | String | *Required* | Conditioning text description |\n| `-W, -H` | `width, height`\
  \ | `width, height` | Integer | `512` | Synthesis resolution |\n| `-s, --steps` | `steps` | `steps` | Integer | `8` (DiT)\
  \ / `6` (LCM) | Numerical solver sampling iterations |\n| `-c, --cfg` | `cfg_scale` | `cfgScale` | Float | `1.0` (DiT) /\
  \ `1.5` (LCM) | Classifier-Free Guidance scale |\n| `--sampler` | `sampler` | `sampler` | String | `euler` / `lcm` | Denoising\
  \ ODE solver algorithm |\n| `-d, --device` | `device` | `device` | String | `vulkan` | Hardware accelerator (`vulkan`, `cpu`)\
  \ |\n| `--preset` | `preset` | `preset` | String | `z-image-turbo` | Production-verified configuration bundle |\n| `--stream-layers`\
  \ | `stream_layers` | `streamLayers` | Boolean | `True` (DiT) | Dynamic layer streaming over AXI bus |\n| `--max-vram` |\
  \ `max_vram` | `maxVram` | String | `vulkan0=1` | GPU memory ceiling to avert OS LMK aborts |\n| `--diffusion-fa` | `diffusion_fa`\
  \ | `diffusionFa` | Boolean | `True` | Flash Attention $O(N)$ memory reduction |\n| `--clip-on-cpu` | `clip_on_cpu` | `clipOnCpu`\
  \ | Boolean | `True` | Keeps LLM text encoder on CPU cores |\n| `--vae-on-cpu` | `vae_on_cpu` | `vaeOnCpu` | Boolean | `True`\
  \ | Offloads VAE decode to host CPU |\n| `--taesd` | `taesd` | `taesd` | String | `auto` | Tiny AutoEncoder for ~1.2s latent\
  \ decoding |\n\n---\n\n## \U0001F310 Official Ecosystem Documentation\n- [Official Architecture & API Reference](https://uno-km.vercel.app/lib/diffusion/)\n\
  - [Advanced Parameters Handbook](https://uno-km.vercel.app/lib/diffusion/advanced-parameters.html)\n- [Galaxy S21 Z-Image\
  \ Turbo Research Report](docs/research/s21_z_image_turbo_vulkan_research_report.md)\n- [AMEVA Open-Source Foundation Portal](https://uno-km.vercel.app/foundation/index.html)\n\
  \n---\n\n## \U0001F4C4 License\nLicensed under the Apache-2.0 License. Copyright (c) 2026 Eunho Kim ([@uno-km](https://github.com/uno-km)).\n"
readme_pypi_content: "# Termux-Diffusion (Python)\n\n[![PyPI](https://img.shields.io/pypi/v/termux-diffusion.svg?style=flat-square&color=0369a1)](https://pypi.org/project/termux-diffusion/)\n\
  [![Python](https://img.shields.io/pypi/pyversions/termux-diffusion.svg?style=flat-square)](https://pypi.org/project/termux-diffusion/)\n\
  [![License](https://img.shields.io/badge/License-Apache_2.0-004499.svg?style=flat-square)](https://github.com/uno-km/termux-diffusion)\n\
  \n> **Official Z-Image Turbo (6.0B DiT) & Pure Native On-Device Diffusion Acceleration for Android Termux & Samsung Galaxy.**\
  \  \n> *Zero PRoot. Zero Virtualization. 100% Native ARM64 Bionic libc, Khronos Vulkan 1.1+ GPU Shaders & NEON SIMD Vector\
  \ Engine.*\n\n---\n\n## \U0001F680 Major Breakthrough: 6.0B DiT (Z-Image Turbo) Sovereign Mobile Execution\n\n`termux-diffusion\
  \ v1.8.0` introduces official production support for **Z-Image Turbo**, empowering mobile devices to execute modern **6.0\
  \ Billion Parameter Diffusion Transformers (DiT)** natively on-device.\n\n### \U0001F31F Tri-Engine Asymmetric Architecture\n\
  * **Text Encoder (CPU 4-Core)**: 4.0B LLM (`Qwen3-4B-Instruct-2507-Q2_K.gguf`) performs dense context embedding on CPU Big/Prime\
  \ cores (`clip_on_cpu=True`).\n* **DiT Denoising Backbone (Vulkan GPU)**: 6.0B Diffusion Transformer (`z_image_turbo-Q2_K.gguf`)\
  \ accelerated via Khronos Vulkan compute shaders with Tiled Flash Attention (`diffusion_fa=True`).\n* **Ultra-Fast VAE Decoder\
  \ (CPU)**: 10MB Tiny AutoEncoder for FLUX.1 (`taef1.safetensors`) completes latent decoding rapidly without memory spikes (`vae_on_cpu=True`).\n\
  * **Layer Streaming (`stream_layers=True`)**: Breaks through mobile memory limits by streaming layers into Vulkan VRAM sequentially,\
  \ maintaining a strict **1.0 GB VRAM footprint** (`max_vram=\"vulkan0=1\"`) and completely eliminating Android Low Memory\
  \ Killer (LMK) aborts.\n\n---\n\n## \U0001F4F8 Sovereign Physical Verification: Galaxy S21 DiT 8-Step Output\n\n* **Verification\
  \ Image**: [Galaxy S21 Z-Image Turbo 8-Step PNG Artifact](https://raw.githubusercontent.com/uno-km/termux-diffusion/main/docs/research/s21_z_image_turbo_8step.png)\n\
  * **Verification Prompt (Ground Truth)**:\n  ```text\n  \"A cinematic photo of a neon cybernetic tiger walking in Seoul\
  \ street at night\"\n  ```\n* **Verified Input Parameter Engineering**:\n  * `steps=8` (Full numerical convergence ODE solver)\n\
  \  * `cfg_scale=1.0` (Optimal guidance for distilled DiT architecture)\n  * `sampler=\"euler\"` (1st-order Ordinary Differential\
  \ Equation solver)\n  * `device=\"vulkan\"` (Physical GPU acceleration)\n  * `diffusion_fa=True` (Tiled Flash Attention\
  \ enabled)\n  * `stream_layers=True` (Layer residency streaming over AXI bus)\n  * `max_vram=\"vulkan0=1\"` (Strict 1.0\
  \ GB VRAM ceiling, Zero-LMK protection)\n  * `clip_on_cpu=True` (Offloads LLM prompt embedding to CPU Big/Prime cores)\n\
  \  * `vae_on_cpu=True` (Prevents GPU VRAM allocation collisions during decoding)\n  * `taesd=\"auto\"` (Ultra-fast 10MB\
  \ FLUX.1 latent decoder)\n* **Optical Realism**: Specular light scattering from neon signboards on wet Seoul asphalt road\
  \ surfaces, razor-sharp cybernetic armor plates, and micro-texture whiskers cleanly isolated from background noise.\n* **Runtime\
  \ Stability**: 100% completion achieved with zero Out-of-Memory (LMK) aborts and zero thermal throttling termination.\n\n\
  ### \U0001F52C Academic Research & Lab Report Reference\n* **Full Technical Research Report**: [Galaxy S21 Z-Image Turbo\
  \ Vulkan Research Report](https://github.com/uno-km/termux-diffusion/blob/main/docs/research/s21_z_image_turbo_vulkan_research_report.md)\n\
  * **AMEVA Edge Systems Lab (AESL)**: [https://uno-km.vercel.app/labs/](https://uno-km.vercel.app/labs/)\n\n---\n\n## \U0001F4BB\
  \ Python SDK Installation & Practical User Manual\n\n### 1. Installation & Provisioning\n```bash\npkg update && pkg install\
  \ -y python clang termux-api\npip install termux-diffusion\ntermux-diffusion install\n```\n\n### 2. Python API Practical\
  \ Code Example\n\n```python\nimport termux_diffusion as td\n\n# 1. Official Z-Image Turbo 6.0B DiT Synthesis via Python\
  \ API\nimage_path = td.generate(\n    prompt=\"A cinematic photo of a neon cybernetic tiger walking in Seoul street at night\"\
  ,\n    preset=\"z-image-turbo\",\n    steps=8,\n    cfg_scale=1.0,\n    sampler=\"euler\",\n    device=\"vulkan\",\n   \
  \ diffusion_fa=True,\n    stream_layers=True,\n    max_vram=\"vulkan0=1\",\n    clip_on_cpu=True,\n    vae_on_cpu=True,\n\
  \    taesd=\"auto\",\n    output_path=\"/sdcard/Pictures/TermuxDiffusion/cyber_tiger_dit.png\"\n)\nprint(f\"Generated via\
  \ 6.0B DiT Tri-Engine: {image_path}\")\n\n# 2. Fast UNet Standard Inference (DreamShaper 8 LCM 6-Step)\nlcm_path = td.generate(\n\
  \    prompt=\"A cinematic photo of a neon cybernetic tiger walking in Seoul street at night\",\n    model=\"anime\",\n \
  \   steps=6,\n    cfg_scale=1.5,\n    sampler=\"lcm\",\n    device=\"vulkan\",\n    diffusion_fa=True,\n    vae_on_cpu=True,\n\
  \    output_path=\"/sdcard/Pictures/TermuxDiffusion/cyber_tiger_lcm.png\"\n)\nprint(f\"Generated via DreamShaper 8 LCM:\
  \ {lcm_path}\")\n```\n\n---\n\n## \U0001F39B️ Python API Parameter Reference\n\n| Argument | Type | Default | Engineering\
  \ Purpose |\n| :--- | :---: | :---: | :--- |\n| `prompt` | `str` | *Required* | Text conditioning prompt |\n| `width`, `height`\
  \ | `int` | `512` | Image dimensions (multiples of 64) |\n| `steps` | `int` | `8` (DiT) / `6` (LCM) | Numerical solver sampling\
  \ iterations |\n| `cfg_scale` | `float` | `1.0` (DiT) / `1.5` (LCM) | Classifier-Free Guidance scale weight |\n| `sampler`\
  \ | `str` | `\"euler\"` | Denoising ODE solver algorithm |\n| `device` | `str` | `\"vulkan\"` | Accelerator device (`\"\
  vulkan\"`, `\"cpu\"`) |\n| `preset` | `str` | `\"z-image-turbo\"` | Verified configuration bundle |\n| `stream_layers` |\
  \ `bool` | `True` (DiT) | Enables dynamic layer streaming over AXI bus |\n| `max_vram` | `str` | `\"vulkan0=1\"` | GPU memory\
  \ ceiling (1.0 GB) to avert OS LMK aborts |\n| `diffusion_fa` | `bool` | `True` | Flash Attention $O(N)$ memory reduction\
  \ |\n| `clip_on_cpu` | `bool` | `True` | Keeps LLM text encoder on CPU cores |\n| `vae_on_cpu` | `bool` | `True` | Offloads\
  \ VAE decode from GPU to host CPU |\n| `taesd` | `str` | `\"auto\"` | Tiny AutoEncoder for ultra-fast latent decoding |\n| `output_path`\
  \ | `str` | `None` | Path to save output PNG artifact |\n\n---\n\n## \U0001F310 Official Documentation & Ecosystem Links\n\
  - [Official Architecture & API Reference](https://uno-km.vercel.app/lib/diffusion/)\n- [Advanced Parameters Handbook](https://uno-km.vercel.app/lib/diffusion/advanced-parameters.html)\n\
  - [GitHub Repository](https://github.com/uno-km/termux-diffusion)\n- [AMEVA Open-Source Foundation Portal](https://uno-km.vercel.app/foundation/index.html)\n\
  \n---\n\n## \U0001F4C4 License\nLicensed under the Apache-2.0 License. Copyright (c) 2026 Eunho Kim ([@uno-km](https://github.com/uno-km)).\n"
