  \ v1.8.0` introduces official production support for **Z-Image Turbo**, empowering mobile devices to execute modern **6.0\
  \ Billion Parameter Diffusion Transformers (DiT)** natively on-device.\n\n### \U0001F31F Tri-Engine Asymmetric Architecture\n\
  * **Text Encoder (CPU 4-Core)**: 4.0B LLM (`Qwen3-4B-Instruct-2507-Q2_K.gguf`) performs dense context embedding on CPU Big/Prime\
  \ cores (`clipOnCpu: true`).\n* **DiT Denoising Backbone (Vulkan GPU)**: 6.0B Diffusion Transformer (`z_image_turbo-Q2_K.gguf`)\
  \ accelerated via Khronos Vulkan compute shaders with Tiled Flash Attention (`diffusionFa: true`).\n* **Ultra-Fast VAE Decoder\
  \ (CPU)**: 10MB Tiny AutoEncoder for FLUX.1 (`taef1.safetensors`) completes latent decoding rapidly without memory spikes (`vaeOnCpu:\
  \ true`).\n* **Layer Streaming (`streamLayers: true`)**: Breaks through mobile memory limits by streaming layers into Vulkan\
  \ VRAM sequentially, maintaining a strict **1.0 GB VRAM footprint** (`maxVram: \"vulkan0=1\"`) and completely eliminating\
  \ Android Low Memory Killer (LMK) aborts.\n\n---\n\n## \U0001F4F8 Sovereign Physical Verification: Galaxy S21 DiT 8-Step\
  \ Output\n\n* **Verification Image**: [Galaxy S21 Z-Image Turbo 8-Step PNG Artifact](https://raw.githubusercontent.com/uno-km/termux-diffusion/main/docs/research/s21_z_image_turbo_8step.png)\n\
  * **Verification Prompt (Ground Truth)**:\n  ```text\n  \"A cinematic photo of a neon cybernetic tiger walking in Seoul\
