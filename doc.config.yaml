package_name_npm: termux-diffusion
version: v1.8.0
release_name: Official Z-Image Turbo (6.0B DiT) & Sovereign Acceleration Release
license: Apache-2.0
platform: Android ARM64 (Bionic libc / Vulkan / NEON)
github_repo_url: https://github.com/uno-km/termux-diffusion
tagline_en: Official Z-Image Turbo (6.0B DiT) & Pure Native On-Device Diffusion Acceleration for Android Termux
tagline_ko: Android Termux 공식 Z-Image Turbo (6.0B DiT) & 순정 네이티브 온디바이스 확산 가속 런타임
quick_install_cmd: 'pip install termux-diffusion && termux-diffusion install

  # or:

  npm install termux-diffusion && npx termux-diffusion install'
why_challenge_en: Executing modern 6.0B Diffusion Transformers on mobile hardware requires cloud dependencies or leads to
  immediate Out-of-Memory (LMK) aborts due to VRAM exhaustion.
why_challenge_ko: 모바일 스마트폰 환경에서 60억 파라미터급 DiT 확산 트랜스포머 구동은 클라우드 의존성을 요구하거나 VRAM 부족으로 인한 즉각적인 LMK 강제 종료를 유발합니다.
description_en: Executes 6.0B DiT (Z-Image Turbo) and quantized Stable Diffusion models with Tri-Engine asymmetric offloading,
  layer streaming, Vulkan compute shaders, and ARMv8.2-A DotProd/FP16 NEON SIMD.
description_ko: 트라이-엔진 비대칭 오프로딩, 레이어 스트리밍, Vulkan 셰이더 및 ARMv8.2-A DotProd/FP16 NEON SIMD를 통해 60억 파라미터 Z-Image Turbo DiT 및
  GGUF 모델을 1GB VRAM 한도 내에서 100% 무결점으로 완주합니다.
features:
- title_en: Official Z-Image Turbo (6.0B DiT)
  title_ko: 공식 Z-Image Turbo (60억 DiT) 지원
  desc_en: Native mobile execution of 6.0B Diffusion Transformer via Tri-Engine pipeline (Qwen3-4B LLM text encoder + DiT
    backbone + 10MB fast VAE).
  desc_ko: 40억 LLM 텍스트 인코더와 60억 DiT 백본망, 10MB 초고속 VAE를 유기적으로 결합한 트라이-엔진 파이프라인으로 모바일 네이티브 구동을 실현합니다.
- title_en: Dynamic Layer Streaming & Zero-OOM
  title_ko: 동적 레이어 스트리밍 & Zero-OOM
  desc_en: Streams DiT layers into Vulkan VRAM sequentially, maintaining a strict 1.0 GB VRAM footprint to prevent mobile
    LMK kills.
  desc_ko: Vulkan VRAM 점유를 1.0 GB로 고정하고 레이어를 순차 적재·연산하여 안드로이드 메모리 킬러(LMK)에 의한 강제 종료를 원천 차단합니다.
- title_en: Dual-Engine Vulkan GPU & CPU Baseline
  title_ko: Vulkan GPU 및 CPU 듀얼 엔진 가속
  desc_en: Bypasses PRoot with precompiled Khronos Vulkan 1.1+ compute kernels and OpenMP NEON SIMD vector runtime.
  desc_ko: 가상화 오버헤드 없이 Khronos Vulkan 1.1+ 네이티브 GPU 셰이더 및 OpenMP NEON SIMD 벡터 가속을 즉각 제공합니다.
- title_en: Android MediaStore Auto-Indexing
  title_ko: 안드로이드 미디어스토어 자동 동기화
  desc_en: Automatically synchronizes generated images into Pictures/TermuxDiffusion and registers with Android MediaStore.
  desc_ko: 이미지 생성 즉시 안드로이드 미디어스토어에 자동 등록하여 삼성 갤러리 앱에 실시간 반영합니다.
