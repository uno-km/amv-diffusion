  \ solver)\n  * `cfgScale: 1.0` (Optimal guidance for distilled DiT architecture)\n  * `sampler: \"euler\"` (1st-order Ordinary\
  \ Differential Equation solver)\n  * `device: \"vulkan\"` (Physical GPU acceleration)\n  * `diffusionFa: true` (Tiled Flash\
  \ Attention enabled)\n  * `streamLayers: true` (Layer residency streaming over AXI bus)\n  * `maxVram: \"vulkan0=1\"` (Strict\
  \ 1.0 GB VRAM ceiling, Zero-LMK protection)\n  * `clipOnCpu: true` (Offloads LLM prompt embedding to CPU Big/Prime cores)\n\
  \  * `vaeOnCpu: true` (Prevents GPU VRAM allocation collisions during decoding)\n  * `taesd: \"auto\"` (Ultra-fast 10MB\
  \ FLUX.1 latent decoder)\n* **Optical Realism**: Specular light scattering from neon signboards on wet Seoul asphalt road\
  \ surfaces, razor-sharp cybernetic armor plates, and micro-texture whiskers cleanly isolated from background noise.\n* **Runtime\
  \ Stability**: 100% completion achieved with zero Out-of-Memory (LMK) aborts and zero thermal throttling termination.\n\n\
  ### \U0001F52C Academic Research & Lab Report Reference\n* **Full Technical Research Report**: [Galaxy S21 Z-Image Turbo\
  \ Vulkan Research Report](https://github.com/uno-km/termux-diffusion/blob/main/docs/research/s21_z_image_turbo_vulkan_research_report.md)\n\
  * **AMEVA Edge Systems Lab (AESL)**: [https://uno-km.vercel.app/labs/](https://uno-km.vercel.app/labs/)\n\n---\n\n## \U0001F4BB\
  \ Node.js / TypeScript SDK Installation & Practical User Manual\n\n### 1. Installation & Provisioning\n```bash\npkg update\
  \ && pkg install -y nodejs clang termux-api\nnpm install -g termux-diffusion\nnpx termux-diffusion install\n```\n\n### 2.\
  \ TypeScript / Node.js API Practical Code Example\n\n```typescript\nimport { generate, TermuxDiffusion } from \"termux-diffusion\"\
  ;\n\nasync function runSynthesis(): Promise<void> {\n  // 1. Official Z-Image Turbo 6.0B DiT Synthesis via Node.js API\n\
  \  const ditResult = await generate({\n    prompt: \"A cinematic photo of a neon cybernetic tiger walking in Seoul street\
  \ at night\",\n    preset: \"z-image-turbo\",\n    steps: 8,\n    cfgScale: 1.0,\n    sampler: \"euler\",\n    device: \"\
  vulkan\",\n    diffusionFa: true,\n    streamLayers: true,\n    maxVram: \"vulkan0=1\",\n    clipOnCpu: true,\n    vaeOnCpu:\
  \ true,\n    taesd: \"auto\",\n    outputPath: \"/sdcard/Pictures/TermuxDiffusion/cyber_tiger_dit.png\"\n  });\n  console.log(\"\
  6.0B DiT Output saved to Samsung Gallery:\", ditResult.outputPath);\n\n  // 2. Fast UNet Standard Inference (DreamShaper\
  \ 8 LCM 6-Step)\n  const lcmResult = await generate({\n    prompt: \"A cinematic photo of a neon cybernetic tiger walking\
  \ in Seoul street at night\",\n    model: \"anime\",\n    steps: 6,\n    cfgScale: 1.5,\n    sampler: \"lcm\",\n    device:\
  \ \"vulkan\",\n    diffusionFa: true,\n    vaeOnCpu: true,\n    outputPath: \"/sdcard/Pictures/TermuxDiffusion/cyber_tiger_lcm.png\"\
  \n  });\n  console.log(\"DreamShaper 8 LCM Output:\", lcmResult.outputPath);\n}\n\nrunSynthesis().catch(console.error);\n\
  ```\n\n---\n\n## \U0001F39B️ Node.js API Parameter Reference\n\n| Option Property | Type | Default | Engineering Purpose\
  \ |\n| :--- | :---: | :---: | :--- |\n| `prompt` | `string` | *Required* | Text conditioning prompt |\n| `width`, `height`\
  \ | `number` | `512` | Image dimensions (multiples of 64) |\n| `steps` | `number` | `8` (DiT) / `6` (LCM) | Numerical solver\
  \ sampling iterations |\n| `cfgScale` | `number` | `1.0` (DiT) / `1.5` (LCM) | Classifier-Free Guidance scale weight |\n\
  | `sampler` | `string` | `\"euler\"` | Denoising ODE solver algorithm |\n| `device` | `string` | `\"vulkan\"` | Accelerator\
  \ device (`\"vulkan\"`, `\"cpu\"`) |\n| `preset` | `string` | `\"z-image-turbo\"` | Verified configuration bundle |\n| `streamLayers`\
  \ | `boolean` | `true` (DiT) | Enables dynamic layer streaming over AXI bus |\n| `maxVram` | `string` | `\"vulkan0=1\"`\
  \ | GPU memory ceiling (1.0 GB) to avert OS LMK aborts |\n| `diffusionFa` | `boolean` | `true` | Flash Attention $O(N)$\
  \ memory reduction |\n| `clipOnCpu` | `boolean` | `true` | Keeps LLM text encoder on CPU cores |\n| `vaeOnCpu` | `boolean`\
  \ | `true` | Offloads VAE decode from GPU to host CPU |\n| `taesd` | `string` | `\"auto\"` | Tiny AutoEncoder for ~1.2s\
  \ latent decoding |\n| `outputPath` | `string` | `undefined` | Path to save output PNG artifact |\n\n---\n\n## \U0001F310\
