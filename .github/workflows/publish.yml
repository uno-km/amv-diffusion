name: Publish to npm, PyPI & GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish to Public npm Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          npm publish --access public || echo "npm version already exists or publish skipped"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --skip-existing dist/* || echo "PyPI release already exists or token skipped"

  publish-github-packages:
    name: Publish to GitHub Packages Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@uno-km'

      - name: Publish to GitHub Packages Registry
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@uno-km:registry=https://npm.pkg.github.com" >> ~/.npmrc

          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@uno-km/termux-diffusion";
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            pkg.repository = "https://github.com/uno-km/termux-diffusion";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm publish --registry=https://npm.pkg.github.com || echo "GitHub package publish skipped or already exists"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

