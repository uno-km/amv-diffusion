[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amv-diffusion"
version = "2.1.0"
description = "AmfyUI (ComfyUI Mobile DAG Studio) & Z-Image Turbo (6.0B DiT) On-Device Diffusion Runtime for Android Termux"
readme = "README.pypi.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "uno-km (AMEVA Foundation)", email = "zhfldk014745@naver.com" }
]
keywords = [
    "stable-diffusion",
    "diffusion",
    "termux",
    "android",
    "samsung-galaxy",
    "edge-ai",
    "on-device-ai",
    "image-generation",
    "text-to-image",
    "gguf",
    "arm64",
    "aarch64",
    "neon",
    "simd",
    "bionic-libc",
    "vae-tiling",
    "galaxy-s25",
    "galaxy-s21"
]
dynamic = ["classifiers"]
dependencies = ["ameva-device-sdk @ https://github.com/uno-km/ameva-device-sdk/releases/download/v0.2.0/ameva_device_sdk-0.2.0-py3-none-any.whl#sha256=81e555feb798a1d84c5e605c831d80a33ecb579d32e14a74ca4674ad9ab03085", "ameva-component-sdk @ https://github.com/uno-km/ameva-component-sdk/releases/download/v0.1.2/ameva_component_sdk-0.1.2-py3-none-any.whl#sha256=6d02eaf3cbd0be9ed02ab24f279eb3736da8c3a1c28762e3411ee428931549c6"]

[project.optional-dependencies]
gpu = ["ameva-runtime>=2.0.0"]
detailer = ["numpy>=1.20.0", "Pillow>=8.0.0"]

[project.urls]
Homepage = "https://github.com/uno-km/termux-diffusion"
Documentation = "https://uno-km.github.io/termux-diffusion/"
"npm Package" = "https://www.npmjs.com/package/termux-diffusion"
"Bug Tracker" = "https://github.com/uno-km/termux-diffusion/issues"
"Source" = "https://github.com/uno-km/termux-diffusion"

[project.scripts]
termux-diffusion = "termux_diffusion.cli:main"
termux-diffusion-install = "termux_diffusion.cli:run_install_cli"
termux-diffusion-doctor = "termux_diffusion.cli:run_doctor_cli"

[project.entry-points."ameva.components"]
termux-diffusion = "termux_diffusion.adapter:create_adapter"


[tool.setuptools.package-data]
termux_diffusion = [
    "data/*.json",
    "data/*.pub"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
