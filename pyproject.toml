[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-diffusion"
version = "1.6.7"
description = "Pure CPU On-Device Stable Diffusion Runtime for Android Termux (ARM64 Bionic NEON SIMD)"
readme = "README.pypi.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "uno-km (AMEVA Foundation)", email = "zhfldk014745@naver.com" }
]
keywords = [
    "stable-diffusion",
    "diffusion",
    "termux",
    "android",
    "samsung-galaxy",
    "edge-ai",
    "on-device-ai",
    "image-generation",
    "text-to-image",
    "gguf",
    "arm64",
    "aarch64",
    "neon",
    "simd",
    "bionic-libc",
    "vae-tiling",
    "galaxy-s25",
    "galaxy-s21"
]
dynamic = ["classifiers"]
dependencies = []

[project.optional-dependencies]
gpu = ["ameva-runtime>=2.0.0"]

[project.urls]
Homepage = "https://github.com/uno-km/termux-diffusion"
Documentation = "https://uno-km.github.io/termux-diffusion/"
"npm Package" = "https://www.npmjs.com/package/termux-diffusion"
"Bug Tracker" = "https://github.com/uno-km/termux-diffusion/issues"
"Source" = "https://github.com/uno-km/termux-diffusion"

[project.scripts]
termux-diffusion = "termux_diffusion.cli:main"
termux-diffusion-install = "termux_diffusion.cli:run_install_cli"
termux-diffusion-doctor = "termux_diffusion.cli:run_doctor_cli"

[project.entry-points."ameva.components"]
termux-diffusion = "termux_diffusion.adapter:create_adapter"


[tool.setuptools.package-data]
termux_diffusion = [
    "data/*.json",
    "data/*.pub"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
